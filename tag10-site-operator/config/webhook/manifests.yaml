---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-web-lab-example-v1alpha1-staticsite
  failurePolicy: Fail
  name: mstaticsite-v1alpha1.kb.io
  rules:
  - apiGroups:
    - web.lab.example
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - staticsites
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-web-lab-example-v1alpha1-staticsite
  failurePolicy: Fail
  name: vstaticsite-v1alpha1.kb.io
  rules:
  - apiGroups:
    - web.lab.example
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - staticsites
  sideEffects: None
