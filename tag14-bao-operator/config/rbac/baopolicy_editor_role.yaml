# This rule is not used by the project tag14-bao-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the bao.lab.example.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tag14-bao-operator
    app.kubernetes.io/managed-by: kustomize
  name: baopolicy-editor-role
rules:
- apiGroups:
  - bao.lab.example
  resources:
  - baopolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - bao.lab.example
  resources:
  - baopolicies/status
  verbs:
  - get
