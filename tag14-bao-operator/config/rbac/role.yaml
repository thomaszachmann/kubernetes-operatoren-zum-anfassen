---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - bao.lab.example
  resources:
  - baopolicies
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - bao.lab.example
  resources:
  - baopolicies/status
  verbs:
  - update
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
