# This rule is not used by the project tag14-bao-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to bao.lab.example resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tag14-bao-operator
    app.kubernetes.io/managed-by: kustomize
  name: baopolicy-viewer-role
rules:
- apiGroups:
  - bao.lab.example
  resources:
  - baopolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - bao.lab.example
  resources:
  - baopolicies/status
  verbs:
  - get
