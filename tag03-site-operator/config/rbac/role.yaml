---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - web.lab.example
  resources:
  - staticsites
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - web.lab.example
  resources:
  - staticsites/finalizers
  verbs:
  - update
- apiGroups:
  - web.lab.example
  resources:
  - staticsites/status
  verbs:
  - get
  - patch
  - update
